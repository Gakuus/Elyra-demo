<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>Iniciar sesión — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/base.css?v=5" rel="stylesheet">
    <link href="css/pages/ingreso.css?v=4" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
</head>
<body>

<div class="pagina-ingreso">
    <div class="caja-ingreso">
        <div class="cabecera-caja-ingreso">
            Hospital de Clínicas
        </div>
        <div class="cuerpo-caja-ingreso">
            <div class="logo-caja-ingreso">
                <img src="img/elyralogo.png" alt="Elyra">
            </div>
            <div class="titulo-caja-ingreso">Sistema de Gestión Hospitalaria</div>
            <p class="texto-atenuado texto-pequeno texto-centrado margen-inferior-3">Ingresá tus credenciales para acceder</p>

            <form method="post">
                <div class="grupo-formulario">
                    <label for="username" class="etiqueta-formulario">Usuario</label>
                    <input type="text" id="username" name="username" class="entrada-formulario ancho-completo" required autocomplete="username" placeholder="Ingrese su usuario" autofocus>
                </div>

                <div class="grupo-formulario">
                    <label for="password" class="etiqueta-formulario">Contraseña</label>
                    <div class="flexible centrar-vertical espacio-1">
                        <input type="password" id="password" name="password" class="entrada-formulario ancho-completo" required autocomplete="current-password" placeholder="Ingrese su contraseña">
                        <button type="button" class="btn btn-sm btn-ojo" tabindex="-1" onclick="togglePassword()">
                            <i class="bi bi-eye-slash" id="pwIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg ancho-completo margen-superior-2">Iniciar Sesión</button>
            </form>

            <p class="texto-centrado margen-superior-3 margen-inferior-0 texto-pequeno">
                <a href="login">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="texto-centrado margen-superior-2 margen-inferior-0 texto-pequeno">
                <a href="registro">¿No tenés cuenta? Registrate</a>
            </p>
            <p class="texto-centrado margen-superior-3 margen-inferior-0 texto-pequeno">
                <a href="">Volver al inicio</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/elyra.js?v=2" defer></script>
</body>
</html>
