<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>Registrarse — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/base.css?v=5" rel="stylesheet">
    <link href="css/pages/ingreso.css?v=4" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
</head>
<body>

<div class="pagina-ingreso" style="background-image: linear-gradient(rgb(0 0 0 / 45%), rgb(0 0 0 / 45%)), url('/img/hospital-de-clinicas.jpg'); background-position: center; background-size: cover; background-repeat: no-repeat;">
    <div class="caja-ingreso" style="max-width: 640px;">
        <div class="cabecera-caja-ingreso">
            Hospital de Clínicas
        </div>
        <div class="cuerpo-caja-ingreso">
            <div class="logo-caja-ingreso">
                <img src="img/elyralogo.png" alt="Elyra">
            </div>
            <div class="titulo-caja-ingreso">Crear cuenta de usuario</div>
            <p class="texto-atenuado texto-pequeno texto-centrado margen-inferior-3">Completá tus datos para registrarte</p>

            <form method="post">
                <div class="flexible espacio-2">
                    <div class="grupo-formulario ancho-completo">
                        <label for="nombre" class="etiqueta-formulario">Nombre <span class="texto-peligro">*</span></label>
                        <input type="text" id="nombre" name="nombre" class="entrada-formulario ancho-completo" required maxlength="100" placeholder="Nombre">
                    </div>
                    <div class="grupo-formulario ancho-completo">
                        <label for="apellido" class="etiqueta-formulario">Apellido <span class="texto-peligro">*</span></label>
                        <input type="text" id="apellido" name="apellido" class="entrada-formulario ancho-completo" required maxlength="100" placeholder="Apellido">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="email" class="etiqueta-formulario">Email <span class="texto-peligro">*</span></label>
                    <input type="email" id="email" name="email" class="entrada-formulario ancho-completo" required maxlength="150" placeholder="correo@gmail.com">
                </div>

                <div class="grupo-formulario">
                    <label for="documento" class="etiqueta-formulario">Cédula <span class="texto-peligro">*</span></label>
                    <input type="text" id="documento" name="documento" class="entrada-formulario ancho-completo" required maxlength="8" data-numeric placeholder="8 dígitos">
                </div>

                <div class="flexible espacio-2">
                    <div class="grupo-formulario ancho-completo">
                        <label for="username" class="etiqueta-formulario">Usuario <span class="texto-peligro">*</span></label>
                        <input type="text" id="username" name="username" class="entrada-formulario ancho-completo" required minlength="3" maxlength="50" placeholder="Usuario">
                    </div>
                    <div class="grupo-formulario ancho-completo">
                        <label for="telefono" class="etiqueta-formulario">Teléfono</label>
                        <input type="text" id="telefono" name="telefono" class="entrada-formulario ancho-completo" maxlength="9" data-numeric placeholder="8-9 dígitos">
                    </div>
                </div>

                <div class="flexible espacio-2">
                    <div class="grupo-formulario ancho-completo">
                        <label for="password" class="etiqueta-formulario">Contraseña <span class="texto-peligro">*</span></label>
                        <div class="flexible centrar-vertical espacio-1">
                            <input type="password" id="password" name="password" class="entrada-formulario ancho-completo" required minlength="8" placeholder="Mín. 8 caracteres">
                            <button type="button" class="btn btn-sm ver-contrasena" tabindex="-1" onclick="togglePw('password', 'pwIcon')" style="flex-shrink:0;">
                                <i class="bi bi-eye-slash" id="pwIcon"></i>
                            </button>
                        </div>
                        <p class="texto-atenuado texto-pequeno">Recomendá usar mayúsculas, números y símbolos para mayor seguridad.</p>
                    </div>
                    <div class="grupo-formulario ancho-completo">
                        <label for="password2" class="etiqueta-formulario">Repetir contraseña <span class="texto-peligro">*</span></label>
                        <div class="flexible centrar-vertical espacio-1">
                            <input type="password" id="password2" name="password2" class="entrada-formulario ancho-completo" required minlength="8" placeholder="Repetir contraseña">
                            <button type="button" class="btn btn-sm ver-contrasena" tabindex="-1" onclick="togglePw('password2', 'pwIcon2')" style="flex-shrink:0;">
                                <i class="bi bi-eye-slash" id="pwIcon2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg ancho-completo margen-superior-2">Crear cuenta</button>
            </form>

            <p class="texto-centrado margen-superior-3 margen-inferior-0 texto-pequeno">
                <a href="login">¿Ya tenés cuenta? Iniciá sesión</a>
            </p>
            <p class="texto-centrado margen-superior-2 margen-inferior-0 texto-pequeno">
                <a href="">Volver al inicio</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/elyra.js?v=2" defer></script>
<script>
function togglePw(id, iconId) {
    var pw = document.getElementById(id);
    var icon = document.getElementById(iconId);
    if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'bi bi-eye';
    } else {
        pw.type = 'password';
        icon.className = 'bi bi-eye-slash';
    }
}
</script>
</body>
</html>
