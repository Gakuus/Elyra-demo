<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>{{titulo}} — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/base.css?v=5" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
    <style>
        .contenedor-encuesta { max-width: 720px; margin: 40px auto 60px; padding: 0 16px; }
        .contenedor-encuesta .panel { background: #FFF; border: 1px solid #DDD; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; }
        .contenedor-encuesta .cuerpo-panel { padding: 28px; }
        .pregunta-publica { border-bottom: 1px solid #EEE; }
        .pregunta-publica:last-of-type { border-bottom: 0; }
        .escala-label { cursor: pointer; text-align: center; }
        .escala-label input { display: none; }
        .escala-label span {
            display: inline-flex; align-items: center; justify-content: center;
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid #C9D4E8; font-weight: 600; color: #2A4780;
            transition: all .15s ease-in-out;
        }
        .escala-label input:checked + span {
            background: #3B5998; border-color: #3B5998; color: #FFF;
            transform: scale(1.08);
        }
        .mc-label { cursor: pointer; border-color: #D6DEEC !important; transition: background .15s ease-in-out; }
        .mc-label:hover { background: #F0F4FB; }
        .mc-label input { accent-color: #3B5998; width: 18px; height: 18px; }
    </style>
</head>
<body>

<div class="contenedor-encuesta">
    {{contenido_publico}}
</div>

<script src="js/pages/encuesta-publica.js?v=1" defer></script>
</body>
</html>
