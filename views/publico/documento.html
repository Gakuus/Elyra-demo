<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{base_path}}/">
    <title>{{titulo}} — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="public/css/base.css?v=5" rel="stylesheet">
    <link href="public/css/pages/publico/documento.css?v=7" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
</head>
<body>

<div class="doc-publico">
    <div class="tarjeta-doc">
        <div class="icono-doc">
            <i class="bi bi-file-earmark-pdf"></i>
        </div>
        <h1>{{titulo}}</h1>
        <div class="mb-3">
            <span class="badge insignia-doc">{{tipo}}</span>
        </div>
        <p class="text-muted small">Subido el {{fecha}}</p>
        {{#hay_descripcion}}
        <p class="text-muted mt-2">{{descripcion}}</p>
        {{/hay_descripcion}}
        <div class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPdf"
                    data-pdf="publico/archivo?id={{id}}&t={{token}}">
                <i class="bi bi-eye me-1"></i> Ver PDF
            </button>
            <a href="publico/archivo?id={{id}}&t={{token}}&descargar=1" class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i> Descargar PDF</a>
            {{#hay_encuesta}}
            <a href="{{enlace_encuesta}}" class="btn btn-info"><i class="bi bi-chat-square-text me-1"></i> Encuesta de satisfacción</a>
            {{/hay_encuesta}}
        </div>
        <p class="text-muted small text-center mt-3 mb-0">¿Nos ayudás con tu opinión? Contanos cómo fue tu experiencia.</p>
    </div>
</div>

<!-- Modal de vista previa del PDF -->
<div class="modal fade" id="modalPdf" tabindex="-1" aria-labelledby="modalPdfTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalPdfTitulo">{{titulo}}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body p-0">
                <iframe id="pdfFrame" class="pdf-frame" src="about:blank" title="Vista previa del documento"></iframe>
            </div>
            <div class="modal-footer justify-content-between">
                <span class="text-muted small">
                    <i class="bi bi-info-circle me-1"></i>¿No se ve el PDF?
                    <a href="#" id="pdfAbrir" target="_blank" rel="noopener">Abrilo en una pestaña</a>
                </span>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('modalPdf');
        if (!modal) return;
        var frame = document.getElementById('pdfFrame');
        var abrir = document.getElementById('pdfAbrir');

        // Al abrir, carga el PDF dentro del iframe (disposición inline).
        modal.addEventListener('show.bs.modal', function (event) {
            var disparador = event.relatedTarget;
            var url = disparador ? disparador.getAttribute('data-pdf') : '';
            frame.setAttribute('src', url);
            abrir.setAttribute('href', url);
        });

        // Al cerrar, se limpia el iframe para cortar la carga.
        modal.addEventListener('hidden.bs.modal', function () {
            frame.setAttribute('src', 'about:blank');
        });
    });
</script>
</body>
</html>
