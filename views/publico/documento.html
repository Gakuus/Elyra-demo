<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{base_path}}/">
    <title>{{titulo}} — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="public/css/base.css?v=5" rel="stylesheet">
    <link href="public/css/pages/publico/documento.css?v=6" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
</head>
<body>

<div class="doc-publico">
    <div class="tarjeta-doc">
        <div class="icono-doc">
            <i class="bi bi-file-earmark-pdf"></i>
        </div>
        <h1>{{titulo}}</h1>
        <div class="mb-3">
            <span class="badge insignia-doc">{{tipo}}</span>
        </div>
        <p class="text-muted small">Subido el {{fecha}}</p>
        {{#hay_descripcion}}
        <p class="text-muted mt-2">{{descripcion}}</p>
        {{/hay_descripcion}}
        <div class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
            <a href="publico/archivo?id={{id}}" class="btn btn-primary"><i class="bi bi-eye me-1"></i> Ver PDF</a>
            <a href="publico/archivo?id={{id}}&descargar=1" class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i> Descargar PDF</a>
            {{#hay_encuesta}}
            <a href="{{enlace_encuesta}}" class="btn btn-info"><i class="bi bi-chat-square-text me-1"></i> Encuesta de satisfacción</a>
            {{/hay_encuesta}}
        </div>
        <p class="text-muted small text-center mt-3 mb-0">¿Nos ayudás con tu opinión? Contanos cómo fue tu experiencia.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
