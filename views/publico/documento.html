<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>{{titulo}} — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/base.css?v=5" rel="stylesheet">
    <link href="css/pages/home.css?v=5" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
    <style>
        .doc-publico { max-width: 720px; margin: 50px auto; padding: 0 16px; }
        .tarjeta-doc { background: #FFF; border: 1px solid #DDD; border-radius: 8px; padding: 30px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .tarjeta-doc h1 { font-size: 26px; color: #2A4780; }
    </style>
</head>
<body>

<div class="doc-publico">
    <div class="tarjeta-doc">
        <div style="font-size:52px;color:#3B5998;margin-bottom:12px;">
            <i class="bi bi-file-earmark-pdf"></i>
        </div>
        <h1>{{titulo}}</h1>
        <div class="mb-3">
            <span class="badge" style="background:#4F74B8;color:#FFF;">{{tipo}}</span>
        </div>
        <p class="text-muted small">Subido el {{fecha}}</p>
        {{descripcion_bloque}}
        <div class="d-flex gap-2 justify-content-center mt-3 flex-wrap">
            <a href="publico/archivo?id={{id}}" class="btn btn-primary"><i class="bi bi-eye me-1"></i> Ver PDF</a>
            <a href="publico/archivo?id={{id}}&descargar=1" class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i> Descargar PDF</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
