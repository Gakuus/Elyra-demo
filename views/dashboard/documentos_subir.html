<div class="panel">
    <div class="cabecera-panel"><i class="bi bi-upload me-1"></i> Subir nuevo documento</div>
    <div class="cuerpo-panel">
        {{#hay_error}}
        <div class="alert alert-danger d-flex align-items-start gap-2 py-2">
            <i class="bi bi-exclamation-triangle mt-1"></i>
            <div>{{error}}</div>
        </div>
        {{/hay_error}}
        <form method="post" action="documentos/subir" enctype="multipart/form-data" id="uploadForm">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título del documento <span class="requerido">*</span></label>
                <input type="text" name="titulo" id="titulo" class="form-control" required minlength="3" maxlength="200" placeholder="Ej: Indicaciones pre-operatorias" value="{{valor_titulo}}">
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de documento <span class="requerido">*</span></label>
                <select name="tipo" id="tipo" class="form-select" required>
                    {{#opciones_tipo_subir}}
                    <option value="{{fila.id}}" {{#fila.seleccionado}}selected{{/fila.seleccionado}}>{{fila.nombre}}</option>
                    {{/opciones_tipo_subir}}
                </select>
            </div>

            <div class="mb-3">
                <label for="archivo" class="form-label">Archivo PDF <span class="requerido">*</span></label>
                <input type="file" name="archivo" id="archivo" class="form-control" accept=".pdf,application/pdf" required>
                <div class="form-text">Solo PDF &mdash; Máx. 10 MB.</div>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label">Descripción (opcional)</label>
                <textarea name="descripcion" id="descripcion" class="form-control" rows="3" maxlength="500" placeholder="Breve descripción del documento...">{{valor_descripcion}}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload me-1"></i> Subir documento</button>
                <a href="documentos" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
