<div class="panel">
    <div class="cabecera-panel d-flex justify-content-between align-items-center">
        <span><i class="bi bi-person-badge me-1"></i> Ficha de usuario</span>
        <div class="d-flex gap-2">
            <a href="usuarios/editar?id={{id}}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil me-1"></i> Editar</a>
            {{btn_estado}}
            <a href="usuarios" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver</a>
        </div>
    </div>
    <div class="cuerpo-panel">
        <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
            <div>
                <h5 class="titulo-ficha">{{nombre_completo}}</h5>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <span class="insignia">{{categoria}}</span>
                    {{estado_html}}
                    {{rol_html}}
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="text-muted small">Cédula</div>
                <div class="fw-semibold">{{cedula}}</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Email</div>
                <div class="fw-semibold">{{email}}</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Usuario</div>
                <div class="fw-semibold">{{username}}</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Teléfono</div>
                <div class="fw-semibold">{{telefono}}</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Licencia</div>
                <div class="fw-semibold">{{licencia}}</div>
            </div>
            <div class="col-md-4">
                <div class="text-muted small">Registrado</div>
                <div class="fw-semibold">{{fecha_registro}}</div>
            </div>
        </div>

        <h6 class="text-muted mb-2"><i class="bi bi-file-earmark-text me-1"></i> Documentos de esta persona</h6>
        {{bloque_documentos}}
    </div>
</div>

<script src="js/pages/usuarios.js?v=1" defer></script>
