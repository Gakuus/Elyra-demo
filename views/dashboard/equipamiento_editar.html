<div class="panel">
    <div class="cabecera-panel"><i class="bi bi-heart-pulse me-1"></i> Editar equipamiento</div>
    <div class="cuerpo-panel">
        {{#hay_error}}
        <div class="alert alert-danger d-flex align-items-start gap-2 py-2">
            <i class="bi bi-exclamation-triangle mt-1"></i>
            <div>{{error}}</div>
        </div>
        {{/hay_error}}
        <form method="post" action="equipamiento/editar" id="equipamientoForm">
        <input type="hidden" name="_csrf" value="{{csrf_token}}">
            <input type="hidden" name="id" value="{{id}}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre <span style="color:#C00;">*</span></label>
                <input type="text" name="nombre" id="nombre" class="form-control" required maxlength="150"
                       placeholder="Ej: Tensiómetro digital" value="{{valor_nombre}}">
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea name="descripcion" id="descripcion" class="form-control" rows="3" maxlength="5000"
                          placeholder="Detalle opcional del equipamiento">{{valor_descripcion}}</textarea>
            </div>

            <div class="mb-4">
                <label for="stock" class="form-label">Stock <span style="color:#C00;">*</span></label>
                <input type="number" name="stock" id="stock" class="form-control" required min="0" max="100000000"
                       value="{{valor_stock}}">
                <div class="form-text">Cantidad disponible del equipamiento.</div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Guardar cambios</button>
                <a href="equipamiento" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
