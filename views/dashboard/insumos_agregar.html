<div class="panel">
    <div class="cabecera-panel"><i class="bi bi-box-seam me-1"></i> Agregar insumo</div>
    <div class="cuerpo-panel">
        {{mensaje_error}}
        <form method="post" action="insumos/agregar" id="insumoForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre <span style="color:#C00;">*</span></label>
                <input type="text" name="nombre" id="nombre" class="form-control" required maxlength="150"
                       placeholder="Ej: Jeringa 5ml" value="{{valor_nombre}}">
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripci&oacute;n</label>
                <textarea name="descripcion" id="descripcion" class="form-control" rows="3" maxlength="5000"
                          placeholder="Detalle opcional del insumo">{{valor_descripcion}}</textarea>
            </div>

            <div class="mb-4">
                <label for="stock" class="form-label">Stock <span style="color:#C00;">*</span></label>
                <input type="number" name="stock" id="stock" class="form-control" required min="0" max="100000000"
                       value="{{valor_stock}}">
                <div class="form-text">Cantidad disponible del insumo.</div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Agregar insumo</button>
                <a href="insumos" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
