<div class="panel">
    <div class="cabecera-panel d-flex justify-content-between align-items-center">
        <span><i class="bi bi-truck me-1"></i> Vehículos</span>
        <a href="vehiculos/agregar" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i> Agregar</a>
    </div>
    <div class="cuerpo-panel">
        <form method="get" class="d-flex gap-2 mb-3">
            <input type="hidden" name="estado" value="{{estado_sel}}">
            <input type="text" name="q" class="form-control" placeholder="Buscar por patente o modelo..." value="{{q}}">
            <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i> Buscar</button>
        </form>

        <!-- Filtro de estado -->
        <div class="btn-group btn-group-sm filtro-estado mb-3" role="group" aria-label="Filtrar por estado">
            <a href="vehiculos?estado=activos&q={{q_url}}" class="btn btn-outline-secondary{{estado_activos}}">Activos</a>
            <a href="vehiculos?estado=inactivos&q={{q_url}}" class="btn btn-outline-secondary{{estado_inactivos}}">Inactivos</a>
            <a href="vehiculos?estado=todos&q={{q_url}}" class="btn btn-outline-secondary{{estado_todos}}">Todos</a>
        </div>

        {{contenido_vehiculos}}
    </div>
</div>
