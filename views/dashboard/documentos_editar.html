<div class="panel">
    <div class="cabecera-panel"><i class="bi bi-pencil-square me-1"></i> Editar documento</div>
    <div class="cuerpo-panel">
        {{mensaje_error}}
        <form method="post" action="documentos/editar" id="editForm">
            <input type="hidden" name="id" value="{{id}}">

            <div class="mb-3">
                <label for="titulo" class="form-label">T&iacute;tulo del documento <span style="color:#C00;">*</span></label>
                <input type="text" name="titulo" id="titulo" class="form-control" required minlength="3" maxlength="200"
                       placeholder="Ej: Indicaciones pre-operatorias" value="{{valor_titulo}}">
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de documento <span style="color:#C00;">*</span></label>
                <select name="tipo" id="tipo" class="form-select" required>
                    <option value="">Seleccionar tipo...</option>
                    {{opciones_tipo_editar}}
                </select>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label">Descripci&oacute;n (opcional)</label>
                <textarea name="descripcion" id="descripcion" class="form-control" rows="3" maxlength="500"
                          placeholder="Breve descripci&oacute;n del documento...">{{valor_descripcion}}</textarea>
            </div>

            <div class="alert alert-secondary py-2 small">
                <i class="bi bi-info-circle me-1"></i> El archivo PDF no se puede reemplazar ac&aacute;.
                Si necesit&a;s cambiar el archivo, desactiv&aacute; este documento y sub&iacute; uno nuevo.
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Guardar cambios</button>
                <a href="documentos" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
