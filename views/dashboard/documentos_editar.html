<div class="panel">
    <div class="cabecera-panel"><i class="bi bi-pencil-square me-1"></i> Editar documento</div>
    <div class="cuerpo-panel">
        {{#hay_error}}
        <div class="alert alert-danger d-flex align-items-start gap-2 py-2">
            <i class="bi bi-exclamation-triangle mt-1"></i>
            <div>{{error}}</div>
        </div>
        {{/hay_error}}
        <form method="post" action="documentos/editar" id="editForm">
            <input type="hidden" name="id" value="{{id}}">

            <div class="mb-3">
                <label for="titulo" class="form-label">Título del documento <span class="requerido">*</span></label>
                <input type="text" name="titulo" id="titulo" class="form-control" required minlength="3" maxlength="200"
                       placeholder="Ej: Indicaciones pre-operatorias" value="{{valor_titulo}}">
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de documento <span class="requerido">*</span></label>
                <select name="tipo" id="tipo" class="form-select" required>
                    {{#opciones_tipo_editar}}
                    <option value="{{fila.id}}" {{#fila.seleccionado}}selected{{/fila.seleccionado}}>{{fila.nombre}}</option>
                    {{/opciones_tipo_editar}}
                </select>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label">Descripción (opcional)</label>
                <textarea name="descripcion" id="descripcion" class="form-control" rows="3" maxlength="500"
                          placeholder="Breve descripción del documento...">{{valor_descripcion}}</textarea>
            </div>

            <div class="alert alert-secondary py-2 small">
                <i class="bi bi-info-circle me-1"></i> El archivo PDF no se puede reemplazar acá.
                Si necesit&a;s cambiar el archivo, desactivá este documento y subí uno nuevo.
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Guardar cambios</button>
                <a href="documentos" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
