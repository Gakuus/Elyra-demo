<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="{{base_path}}/">
    <title>{{titulo}} — Elyra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="public/css/base.css?v=5" rel="stylesheet">
    <link href="public/css/pages/dashboard.css?v=5" rel="stylesheet">
    <meta name="theme-color" content="#3B5998">
</head>
<body>

<div class="encabezado-sistema">
    <div class="marca-encabezado">
        <a href="dashboard" class="logo-encabezado">
            <img src="public/img/elyralogo.png" alt="Elyra">
            <span>Elyra</span>
        </a>
    </div>
    <div class="usuario-encabezado">
        <span><i class="bi bi-person-circle"></i> {{usuario}}</span>
        <form method="post" action="logout" style="display:inline">
            <button type="submit" class="btn btn-sm btn-link" style="color:#FFF;text-decoration:none;">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </form>
    </div>
</div>

<div class="contenedor-principal">
    <div class="barra-lateral" role="navigation" aria-label="Menú principal">
        <div class="seccion-barra">
            <div class="titulo-seccion">Gestión</div>
            <a href="dashboard" class="enlace-barra{{activo_inicio}}">
                <img src="public/img/silk/house.png" width="16" height="16" alt=""> Inicio</a>
            <a href="encuestas" class="enlace-barra{{activo_encuestas}}">
                <img src="public/img/silk/chart_bar.png" width="16" height="16" alt=""> Encuestas</a>
            <a href="documentos" class="enlace-barra{{activo_documentos}}">
                <img src="public/img/silk/page_white_text.png" width="16" height="16" alt=""> Documentos</a>
            <a href="vehiculos" class="enlace-barra{{activo_vehiculos}}">
                <img src="public/img/silk/lorry.png" width="16" height="16" alt=""> Veh&iacute;culos</a>
        </div>
    </div>

    <div class="contenido-principal" id="main-content">
        {{contenido}}
    </div>
</div>

<div class="pie-pagina">
    &copy; 2026 Hospital de Clinicas - Elyra v1.0
</div>

<div class="modal-overlay" id="qrModal">
    <div class="modal-box" style="max-width:400px;">
        <div class="modal-header">
            <h6 style="margin:0;">Codigo QR</h6>
            <button type="button" class="cerrar-modal" onclick="document.getElementById('qrModal').classList.remove('open')" aria-label="Cerrar">&times;</button>
        </div>
        <div class="modal-body text-center" id="qrModalBody">
            <p class="text-muted small mb-0">Cargando...</p>
        </div>
    </div>
</div>

<!-- Área exclusiva para imprimir el QR grande (oculta en pantalla,
     visible solo durante la impresión vía CSS @media print). -->
<div id="qrPrintArea"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script>window.BASE_PATH = '{{base_path}}';</script>
<script src="public/js/pages/documentos.js?v=2" defer></script>
<script src="public/js/pages/vehiculos.js?v=1" defer></script>
</body>
</html>
