<div class="panel">
    <div class="cabecera-panel d-flex justify-content-between align-items-center">
        <span><i class="bi bi-person-plus me-1"></i> Códigos de funcionario</span>
        <a href="usuarios" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver</a>
    </div>
    <div class="cuerpo-panel">
        {{aviso_nuevo}}

        <div class="info-codigos mb-3">
            <i class="bi bi-info-circle me-1"></i>
            Generá un código y entregáselo a la persona. Al registrarse en la portada pública con ese
            código, su cuenta se creará como <strong>funcionario</strong> con el rol que elegís acá.
            Cada código se puede usar una sola vez.
        </div>

        <form method="post" action="usuarios/codigos" class="flexible espacio-2 align-items-end">
            <div class="grupo-formulario">
                <label for="rolCodigo" class="etiqueta-formulario">Rol que otorga el código</label>
                <select id="rolCodigo" name="rol" class="form-control">
                    <option value="conductor">Conductor</option>
                    <option value="copiloto">Copiloto</option>
                    <option value="admin">Admin</option>
                    <option value="superadmin">Superadmin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-qr-code me-1"></i> Generar código</button>
        </form>

        <hr>

        <h6 class="mb-2"><i class="bi bi-list-ol me-1"></i> Códigos generados</h6>
        {{bloque_tabla}}
    </div>
</div>

<script src="js/pages/usuarios.js?v=2" defer></script>
