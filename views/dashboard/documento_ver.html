<div class="panel">
    <div class="cuerpo-panel">
        <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
            <div>
                <h5 style="margin:0 0 6px;color:#2A4780;">{{titulo}}</h5>
                <div class="d-flex align-items-center gap-2">
                    <span class="insignia">{{tipo}}</span>
                    <small class="text-muted">Subido el {{fecha}}</small>
                </div>
            </div>
            <div class="d-flex gap-2">
                <a href="documentos/archivo?id={{id}}&descargar=1" class="btn btn-primary btn-sm"><i class="bi bi-download me-1"></i> Descargar PDF</a>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="ElyraDoc.verQR({{id}})" title="Ver QR"><i class="bi bi-qr-code"></i> QR</button>
                <a href="documentos" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
            </div>
        </div>

        {{descripcion_bloque}}

        <div class="border rounded" style="overflow:hidden;">
            <embed src="documentos/archivo?id={{id}}" type="application/pdf" class="w-100" style="height:70vh;border:none;">
        </div>
    </div>
</div>
