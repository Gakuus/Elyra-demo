; .user.ini — Límites de subida de PHP sin tocar php.ini (sin root).
;
; El servidor tiene upload_max_filesize = 2M, pero la aplicación acepta PDFs
; de hasta 10 MB. Con 2M, cualquier PDF más grande falla en PHP antes de
; llegar a la app. Estas directivas son PHP_INI_PERDIR: no se pueden cambiar
; con ini_set() en tiempo de ejecución, pero PHP-FPM (FastCGI) SÍ lee este
; archivo para todo el árbol de directorios del proyecto.
;
; Requiere que user_ini.filename esté habilitado (valor por defecto: .user.ini).
; Los cambios se cachean: user_ini.cache_ttl (300 s por defecto).

upload_max_filesize = 10M
post_max_size = 12M
